# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1
parameters:
  GHA_Event:
    type: string
    default: ''
  GHA_Actor:
    type: string
    default: ''
  GHA_Action:
    type: string
    default: ''
  GHA_Meta:
    type: string
    default: ''

jobs:
  test:
    docker:
      - image: cimg/node:20.11.0
    resource_class: xlarge
    steps:
      - checkout
      - run:
          command: npm install
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Remove dev dependencies
          command: npm prune --omit=dev
      - run:
          name: SF.gov site build
          command: npm run build -w @sfgov/next

  deploy_to_aws:
    # for STAGING deploy
    docker:
      - image: continuumio/miniconda3
    steps:
      - run:
          name: install ansible tower cli
          command: |
            if [ "$STAGING_JOB_ID" != "" ]; then
              apt-get update && apt-get install -y vim
              pip install --root-user-action=ignore ansible-tower-cli
            fi
      - run:
          name: build image via tower-cli
          # see: https://tower-cli.readthedocs.io/en/latest/cli_ref/usage/CONFIG_CMD_OPTIONS.html#environment-variables
          command: |
            if [ "$STAGING_BUILD_IMAGE_JOB_ID" != "" ]; then
              export TOWER_HOST=$AWX_HOST
              export TOWER_OAUTH_TOKEN=$AWX_ACCESS_TOKEN
              export TOWER_VERBOSE=true
              tower-cli workflow_job launch -W $STAGING_BUILD_IMAGE_JOB_ID --extra-vars="" --wait
            fi
          no_output_timeout: 30m
      - run:
          name: build staging instance via tower-cli
          # see: https://tower-cli.readthedocs.io/en/latest/cli_ref/usage/CONFIG_CMD_OPTIONS.html#environment-variables
          command: |
            if [ "$STAGING_CREATE_INSTANCE_JOB_ID" != "" ]; then
              export TOWER_HOST=$AWX_HOST
              export TOWER_OAUTH_TOKEN=$AWX_ACCESS_TOKEN
              export TOWER_VERBOSE=true
              tower-cli job launch --job-template=$STAGING_CREATE_INSTANCE_JOB_ID --extra-vars="" --wait
            fi
          no_output_timeout: 30m
      - run:
          name: deploy to staging via tower-cli
          # see: https://tower-cli.readthedocs.io/en/latest/cli_ref/usage/CONFIG_CMD_OPTIONS.html#environment-variables
          command: |
            if [ "$STAGING_DEPLOY_JOB_ID" != "" ]; then
              export TOWER_HOST=$AWX_HOST
              export TOWER_OAUTH_TOKEN=$AWX_ACCESS_TOKEN
              export TOWER_VERBOSE=true
              tower-cli job launch --job-template=$STAGING_DEPLOY_JOB_ID --extra-vars="" --wait
            fi
          no_output_timeout: 30m
  deploy_to_dev:
    # for DEV instance deploy
    docker:
      - image: continuumio/miniconda3
    parameters:
      awx_job_env:
        type: string
        default: DEVELOP # default deploy to develop env
    steps:
      - run:
          name: install ansible tower cli
          command: |
            if [ "$<< parameters.awx_job_env >>_JOB_ID" != "" ]; then
              apt-get update && apt-get install -y vim
              pip install --root-user-action=ignore ansible-tower-cli
            fi
      - run:
          name: build image via tower-cli
          # see: https://tower-cli.readthedocs.io/en/latest/cli_ref/usage/CONFIG_CMD_OPTIONS.html#environment-variables
          command: |
            if [ "$<< parameters.awx_job_env >>_JOB_ID" != "" ]; then
              export TOWER_HOST=$AWX_HOST
              export TOWER_OAUTH_TOKEN=$AWX_ACCESS_TOKEN
              export TOWER_VERBOSE=true
              tower-cli workflow_job launch -W $<< parameters.awx_job_env >>_JOB_ID --extra-vars="" --wait
            fi
          no_output_timeout: 60m

  deploy_to_aws_qa:
    docker:
      - image: continuumio/miniconda3
    steps:
      - run:
          name: install ansible tower cli
          command: |
            if [ "$QA_CREATE_INSTANCE_JOB_ID" != "" ]; then
              apt-get update && apt-get install -y vim
              pip install --root-user-action=ignore ansible-tower-cli
            fi
      - run:
          name: build qa site instance via tower-cli
          # see: https://tower-cli.readthedocs.io/en/latest/cli_ref/usage/CONFIG_CMD_OPTIONS.html#environment-variables
          # test
          command: |
            if [ "$QA_CREATE_INSTANCE_JOB_ID" != "" ]; then
              export TOWER_HOST=$AWX_HOST
              export TOWER_OAUTH_TOKEN=$AWX_ACCESS_TOKEN
              export TOWER_VERBOSE=true
              tower-cli job launch --job-template=$QA_CREATE_INSTANCE_JOB_ID --extra-vars="version=${CIRCLE_BRANCH} prbranch=${CIRCLE_PULL_REQUEST##*/}" --wait
            fi
          no_output_timeout: 30m
      - run:
          name: deploy to qa site via tower-cli
          # see: https://tower-cli.readthedocs.io/en/latest/cli_ref/usage/CONFIG_CMD_OPTIONS.html#environment-variables
          command: |
            if [ "$QA_DEPLOY_JOB_ID" != "" ]; then
              export TOWER_HOST=$AWX_HOST
              export TOWER_OAUTH_TOKEN=$AWX_ACCESS_TOKEN
              export TOWER_VERBOSE=true
              tower-cli job launch --job-template=$QA_DEPLOY_JOB_ID --extra-vars="version=${CIRCLE_BRANCH} prbranch=${CIRCLE_PULL_REQUEST##*/}" --wait
            fi
          no_output_timeout: 30m
  teardown_on_aws_qa:
    docker:
      - image: continuumio/miniconda3
    steps:
      - run:
          name: install ansible tower cli
          command: |
            if [ "$QA_TEARDOWN_JOB_ID" != "" ]; then
              apt-get update && apt-get install -y vim
              pip install --root-user-action=ignore ansible-tower-cli
            fi
      - run:
          name: teardown qa site instance via tower-cli
          # see: https://tower-cli.readthedocs.io/en/latest/cli_ref/usage/CONFIG_CMD_OPTIONS.html#environment-variables
          # test
          command: |
            if [ "$QA_TEARDOWN_JOB_ID" != "" ]; then
              export TOWER_HOST=$AWX_HOST
              export TOWER_OAUTH_TOKEN=$AWX_ACCESS_TOKEN
              export TOWER_VERBOSE=true
              tower-cli job launch --job-template=$QA_TEARDOWN_JOB_ID --extra-vars="version=${CIRCLE_BRANCH} prbranch=${CIRCLE_PULL_REQUEST##*/}" --wait
            fi
          no_output_timeout: 30m

workflows:
  # Docs: https://circleci.com/docs/2.0/configuration-reference/#workflows
  build_and_test:
    jobs:
      - test
      - deploy_to_aws:
          filters:
            branches:
              only: main
      - deploy_to_dev:
          awx_job_env: 'DEVELOP'
          filters:
            branches:
              only: develop

  qa_site_deploy:
    jobs:
      - deploy_to_aws_qa
    when:
      equal: ['gha_aws_deploy_qa', << pipeline.parameters.GHA_Action >>]

  qa_site_teardown:
    jobs:
      - teardown_on_aws_qa:
          filters:
            branches:
              ignore:
                - main
                - develop
                - training
    when:
      equal: ['gha_aws_teardown_qa', << pipeline.parameters.GHA_Action >>]

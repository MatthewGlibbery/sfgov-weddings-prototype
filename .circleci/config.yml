# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:20.11.0
    steps:
      - checkout
      - run:
          command: npm install
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Remove dev dependencies
          command: npm prune --omit=dev
      - run:
          name: SF.gov site build
          command: npm run build -w @sfgov/next

  deploy_to_aws:
    docker:
      - image: continuumio/miniconda3
    steps:
      - run:
          command: |
            apt-get update && apt-get install -y vim
            pip install --root-user-action=ignore ansible-tower-cli
            export TOWER_HOST=$AWX_HOST
            export TOWER_OAUTH_TOKEN=$AWX_ACCESS_TOKEN
            tower-cli job launch --job-template=$STAGING_JOB_ID --extra-vars=""  --wait --monitor
            tower-cli job launch --job-template=$PROD_JOB_ID --extra-vars=""  --wait --monitor
workflows:
  # Docs: https://circleci.com/docs/2.0/configuration-reference/#workflows
  build_and_test:
    jobs:
      - test
      - deploy_to_aws:
          filters:
            branches:
              #ignore: main
              only: main

# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  # Docs: https://circleci.com/developer/orbs/orb/circleci/node
  node: circleci/node@5.1.0
  coveralls: coveralls/coveralls@1.0.6

jobs:
  test:
    # These next lines define a Docker executor: https://circleci.com/docs/2.0/executor-types/
    # You can specify an image from Dockerhub or use one of our Convenience Images from CircleCI's Developer Hub.
    # A list of available CircleCI Docker Convenience Images are available here: https://circleci.com/developer/images/image/cimg/node
    docker:
      # Playwright docs: https://playwright.dev/docs/ci#circleci
      # Image tags documentation: https://playwright.dev/docs/docker#image-tags
      # Full list: https://mcr.microsoft.com/en-us/product/playwright/tags
      - image: mcr.microsoft.com/playwright:v1.30.0-focal
    steps:
      - checkout
      - node/install:
          node-version: 18.15.0
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm run test:unit
      - coveralls/upload
      - run:
          name: Browser tests
          command: npm run test:browser

workflows:
  # Docs: https://circleci.com/docs/2.0/configuration-reference/#workflows
  sample:
    jobs:
      - test

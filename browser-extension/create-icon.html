<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icon</title>
</head>
<body>
  <canvas id="canvas" width="128" height="128"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, 128, 128);

    // Text
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('git', 64, 64);

    // Convert to blob and download
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'icon.png';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
  <p>Icon should download automatically. If not, right-click the square above and "Save Image As" → icon.png</p>
  <p>Place the icon.png file in the browser-extension folder.</p>
</body>
</html>

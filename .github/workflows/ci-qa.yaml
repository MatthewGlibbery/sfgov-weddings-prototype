name: QA sites
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  check_skip_flags: # pull last commit msg
    name: Check skip flags
    runs-on: ubuntu-latest
    outputs:
      head-commit-message: ${{ steps.get_head_commit_message.outputs.headCommitMsg }}
    steps:
      - name: Get repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print head git commit message
        id: get_head_commit_message
        run: echo "headCommitMsg=$(git show -s --format=%s)" >> $GITHUB_OUTPUT

  trigger-circleci: #only runs if commit message has [qa env]
    runs-on: ubuntu-latest
    needs: check_skip_flags
    steps:
      - name: CircleCI Trigger on Pull Request
        if: ${{ contains(needs.check_skip_flags.outputs.head-commit-message, '[qa env]') }}
        id: gha_aws_deploy_qa
        uses: CircleCI-Public/trigger-circleci-pipeline-action@v1.0.5
        env:
          CCI_TOKEN: ${{ secrets.QA_SITE_NEXT_TOKEN }}

name: Create Release and Deploy to Production

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to merge into main (or "main" to tag main without merging)'
        required: true
        default: 'develop'
        type: string
      release_notes:
        description: 'Release notes (optional - auto-generated from commits if empty)'
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin main:main
          if [ "${{ inputs.source_branch }}" != "main" ]; then
            git fetch origin ${{ inputs.source_branch }}:${{ inputs.source_branch }}
          fi

      - name: Validate source branch exists
        run: |
          if [ "${{ inputs.source_branch }}" != "main" ]; then
            if ! git rev-parse --verify ${{ inputs.source_branch }} >/dev/null 2>&1; then
              echo "Error: Branch '${{ inputs.source_branch }}' does not exist"
              exit 1
            fi
          fi

      - name: Checkout source branch and pull latest
        if: ${{ inputs.source_branch != 'main' }}
        run: |
          git checkout ${{ inputs.source_branch }}
          git pull origin ${{ inputs.source_branch }}

      - name: Checkout main and pull latest
        run: |
          git checkout main
          git pull origin main

      - name: Determine version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2025-01-01-000000")
          echo "Latest tag: $LATEST_TAG"

          # Generate new version based on current datetime
          # Format: vYYYY-MM-DD-HHMMSS
          NEW_VERSION=$(date -u +'v%Y-%m-%d-%H%M%S')

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "previous_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "New version will be: ${NEW_VERSION}"

      - name: Delete existing draft releases
        run: |
          # Find and delete any draft releases to ensure fresh notes
          gh release list --limit 100 | grep "Draft" | awk '{print $1}' | while read -r tag; do
            echo "Deleting draft release: $tag"
            gh release delete "$tag" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG="${{ steps.version.outputs.previous_tag }}"
          SOURCE_BRANCH="${{ inputs.source_branch }}"

          # Start release notes
          echo "# Release ${{ steps.version.outputs.new_version }}" > release_notes.md
          echo "" >> release_notes.md

          # Use custom release notes if provided, otherwise generate from commits
          if [ -n "${{ inputs.release_notes }}" ]; then
            echo "${{ inputs.release_notes }}" >> release_notes.md
            echo "" >> release_notes.md
          else
            echo "## Changes" >> release_notes.md
            echo "" >> release_notes.md
            # Generate changelog from commits since last tag
            # If source_branch is main, use main; otherwise use the source branch
            if [ "$SOURCE_BRANCH" = "main" ]; then
              git log ${PREV_TAG}..main --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
            else
              git log ${PREV_TAG}..${SOURCE_BRANCH} --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
            fi
            echo "" >> release_notes.md
          fi

          echo "" >> release_notes.md
          if [ "$SOURCE_BRANCH" != "main" ]; then
            echo "**Source**: ${SOURCE_BRANCH} → main" >> release_notes.md
            echo "" >> release_notes.md
          fi
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.new_version }}" >> release_notes.md

          cat release_notes.md

          # Set output for later use
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Merge source branch into main
        if: ${{ inputs.source_branch != 'main' }}
        run: |
          git checkout main
          git merge ${{ inputs.source_branch }} --no-ff -m "Release ${{ steps.version.outputs.new_version }}: Merge ${{ inputs.source_branch }} into main"

      - name: Create and push tag
        run: |
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin main
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          body: ${{ steps.release_notes.outputs.release_notes }}
          draft: false
          prerelease: false

      - name: Summary
        run: |
          echo "## Release Created Successfully! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous Release**: ${{ steps.version.outputs.previous_tag }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.source_branch }}" = "main" ]; then
            echo "- **Action**: Tagged main (no merge)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Merged**: ${{ inputs.source_branch }} → main" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The CircleCI deployment to production will start automatically." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.new_version }})" >> $GITHUB_STEP_SUMMARY

# This workflow updates the training environment from a production release.
#
# USAGE:
#   1. Go to Actions → "Update Training from Release"
#   2. Click "Run workflow"
#   3. Enter the release tag to deploy (e.g., v2026-04-01-160903)
#
# What it does:
# 1. Creates a unique training-<release-tag> branch from training
# 2. Merges the specified release tag into it (preserving training-specific features like banners, CSS, user permissions)
# 3. Runs tests (lint, unit tests)
# 4. If tests pass:
#    - Builds and tags Docker image as platform/web:training and platform/web:training-<release-tag>
#    - Pushes to ECR
#    - Restarts cms-training-web ECS service
#    - Waits for deployment to stabilize (15 min timeout)
#    - Pushes the training-<release-tag> branch to remote
#    - Cleans up old training-* branches (keeps only the new one)
#
# Triggers:
# - Manual only (workflow_dispatch)
#
# Note: Does NOT automatically promote to the training branch.
# After verifying the deployment, manually run "Promote Training Update" workflow.
# This preserves merge conflict resolution for the next deployment.
#
# AWS Authentication:
# - Uses OIDC (OpenID Connect) with role: GitHubActionsDeployRole
# - No long-lived credentials stored
# - Temporary credentials granted per workflow run
#
# Concurrency:
# - Only one run at a time (cancel-in-progress prevents race conditions)
# - Newer releases cancel older in-flight runs

name: Update Training from Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (e.g., v2026-04-01-160903)'
        required: true
        type: string

concurrency:
  group: update-training
  cancel-in-progress: true

jobs:
  deploy-training:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for merge

      - name: Configure git
        run: |
          git config user.email "github-actions@sfgov.org"
          git config user.name "GitHub Actions Bot"

      - name: Set release tag
        id: release
        run: |
          echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Create training branch and merge release into it
        run: |
          git fetch origin training
          git fetch origin tag ${{ steps.release.outputs.tag }}
          git checkout -b training-${{ steps.release.outputs.tag }} origin/training
          git merge ${{ steps.release.outputs.tag }} --no-edit -m "Merge release ${{ steps.release.outputs.tag }} into training"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::395833734759:role/GitHubActionsDeployRole
          aws-region: us-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 -t 395833734759.dkr.ecr.us-west-1.amazonaws.com/platform/web:training .
          docker tag 395833734759.dkr.ecr.us-west-1.amazonaws.com/platform/web:training 395833734759.dkr.ecr.us-west-1.amazonaws.com/platform/web:training-${{ steps.release.outputs.tag }}
          docker push 395833734759.dkr.ecr.us-west-1.amazonaws.com/platform/web:training
          docker push 395833734759.dkr.ecr.us-west-1.amazonaws.com/platform/web:training-${{ steps.release.outputs.tag }}

      - name: Restart ECS service
        run: |
          aws ecs update-service --cluster cms-common --service cms-training-web --force-new-deployment --region us-west-1

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster cms-common \
            --services cms-training-web \
            --region us-west-1
        timeout-minutes: 15

      - name: Push training branch to remote
        run: |
          git push origin training-${{ steps.release.outputs.tag }}

      - name: Clean up old training branches
        run: |
          # List all remote training-* branches except the current one and base training
          OLD_BRANCHES=$(git ls-remote --heads origin 'refs/heads/training-*' | \
            grep -v "training-${{ steps.release.outputs.tag }}$" | \
            awk '{print $2}' | \
            sed 's|refs/heads/||')

          # Delete old branches if any exist
          if [ -n "$OLD_BRANCHES" ]; then
            echo "Deleting old training branches:"
            echo "$OLD_BRANCHES"
            echo "$OLD_BRANCHES" | xargs -I {} git push origin --delete {}
          else
            echo "No old training branches to clean up"
          fi
